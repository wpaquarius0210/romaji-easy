<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ローマ字→かな クイズ（選択式・100語）</title>
<style>
  :root{ --bg:#fffdf8; --card:#ffffff; --accent:#2e7d32; --wrong:#c62828; --muted:#6b7280; --shadow:0 6px 18px rgba(0,0,0,.08); --radius:16px; }
  body{ margin:0; font-family: "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,-apple-system,sans-serif; background:var(--bg); color:#111; line-height:1.6; }
  header{ padding:12px 16px 0 16px; text-align:center; }
  header h1{ font-size:clamp(22px,3.6vw,32px); margin:8px 0 2px; }
  header p{ color:var(--muted); margin:0 0 12px; }
  .container{ max-width:980px; margin:0 auto; padding:12px 16px 32px; }
  .card{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin:12px 0; }
  .row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .grow{ flex:1 1 auto; }
  .badge{ display:inline-block; background:#eef2ff; color:#1e40af; border-radius:999px; padding:4px 10px; font-size:13px; }
  .q-box{ text-align:center; padding:18px 12px; border:2px dashed #e5e7eb; border-radius:12px; background:#fafafa; }
  .q{ font-size:clamp(28px,6vw,56px); font-weight:700; letter-spacing:.02em; }
  button{ cursor:pointer; border:none; border-radius:10px; padding:10px 14px; font-size:16px; font-weight:600; background:#111; color:#fff; }
  button.secondary{ background:#e5e7eb; color:#111; }
  .feedback{ min-height:28px; text-align:center; font-size:clamp(18px,3.2vw,22px); font-weight:700; margin:6px 0 2px; }
  .feedback.ok{ color:var(--accent); } .feedback.ng{ color:var(--wrong); }
  .hint{ text-align:center; color:#6b7280; font-size:18px; min-height:24px; }
  .stats{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center; color:#374151; }
  .pill{ background:#f1f5f9; border-radius:999px; padding:6px 10px; font-weight:700; }
  .opts{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .opt{ background:#f8fafc; color:#111; border:2px solid #e2e8f0; padding:12px 16px; border-radius:12px; font-size:clamp(22px,3.6vw,28px); min-width:140px; }
  .opt.correct{ border-color:#16a34a; background:#ecfdf5; }
  .opt.wrong{ border-color:#dc2626; background:#fef2f2; }
  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center; margin-top:8px; }
  .small{ font-size:13px; color:#6b7280; }
  footer{ text-align:center; color:#64748b; font-size:12px; padding:10px 0 24px; }
</style>
</head>
<body>
<header>
  <h1>ローマ字 → かな クイズ（選択式・100語）</h1>
  <p>えらんでこたえよう（同じ仲間のことばから選択肢が出ます）／オフライン対応</p>
</header>

<div class="container">
  <div class="card">
    <div class="row" aria-label="設定">
      <div class="grow"><span class="badge">100語・選択式</span></div>
      <label class="small"><input type="checkbox" id="autoNext" checked> 正解でじどうで次へ</label>
      <button class="secondary" id="shuffleBtn">シャッフル</button>
      <button class="secondary" id="resetBtn">リセット</button>
    </div>

    <div class="q-box" role="group" aria-label="問題">
      <div id="counter" class="small">1 / 100</div>
      <div id="q" class="q" aria-live="polite">loading…</div>

      <div id="choiceArea" class="opts"></div>

      <div class="toolbar">
        <button id="hintBtn" class="secondary">ヒント</button>
        <button id="showBtn" class="secondary">こたえをみる</button>
        <button id="speakBtn" class="secondary">▶ よみあげ（かな）</button>
        <button id="nextBtn" class="secondary">つぎ</button>
      </div>

      <div id="feedback" class="feedback" aria-live="polite"></div>
      <div id="hint" class="hint"></div>

      <div class="stats" role="status">
        <span class="pill">正解 <span id="ok">0</span></span>
        <span class="pill">不正解 <span id="ng">0</span></span>
        <span class="pill">正答率 <span id="rate">0</span>%</span>
      </div>
    </div>
  </div>
</div>

<footer>© ローマ字→かな クイズ（選択式・100語）／類似概念の選択肢を自動生成します。</footer>

<script>
// ====== データ（100語：q=ローマ字, a=かな, cat=カテゴリ） ======
const DATA = [
  // どうぶつ（20）
  {q:"inu", a:"いぬ", cat:"どうぶつ"}, {q:"neko", a:"ねこ", cat:"どうぶつ"}, {q:"uma", a:"うま", cat:"どうぶつ"}, {q:"saru", a:"さる", cat:"どうぶつ"},
  {q:"usi", a:"うし", cat:"どうぶつ"}, {q:"kani", a:"かに", cat:"どうぶつ"}, {q:"tako", a:"たこ", cat:"どうぶつ"}, {q:"ika", a:"いか", cat:"どうぶつ"},
  {q:"sakana", a:"さかな", cat:"どうぶつ"}, {q:"tori", a:"とり", cat:"どうぶつ"}, {q:"karasu", a:"からす", cat:"どうぶつ"}, {q:"kaeru", a:"かえる", cat:"どうぶつ"},
  {q:"ari", a:"あり", cat:"どうぶつ"}, {q:"kumo", a:"くも", cat:"どうぶつ"}, {q:"hati", a:"はち", cat:"どうぶつ"}, {q:"kame", a:"かめ", cat:"どうぶつ"},
  {q:"sika", a:"しか", cat:"どうぶつ"}, {q:"tanuki", a:"たぬき", cat:"どうぶつ"}, {q:"tora", a:"とら", cat:"どうぶつ"}, {q:"niwatori", a:"にわとり", cat:"どうぶつ"},

  // からだ（13）
  {q:"atama", a:"あたま", cat:"からだ"}, {q:"mimi", a:"みみ", cat:"からだ"}, {q:"kuti", a:"くち", cat:"からだ"}, {q:"iki", a:"いき", cat:"からだ"},
  {q:"hana", a:"はな", cat:"からだ"}, {q:"onaka", a:"おなか", cat:"からだ"}, {q:"senaka", a:"せなか", cat:"からだ"}, {q:"asi", a:"あし", cat:"からだ"},
  {q:"kata", a:"かた", cat:"からだ"}, {q:"kakato", a:"かかと", cat:"からだ"}, {q:"tenohira", a:"てのひら", cat:"からだ"}, {q:"waki", a:"わき", cat:"からだ"},
  {q:"tume", a:"つめ", cat:"からだ"},

  // たべもの（9） + のみもの（1）
  {q:"kome", a:"こめ", cat:"たべもの"}, {q:"momo", a:"もも", cat:"たべもの"}, {q:"nasi", a:"なし", cat:"たべもの"}, {q:"mikan", a:"みかん", cat:"たべもの"},
  {q:"suika", a:"すいか", cat:"たべもの"}, {q:"kuri", a:"くり", cat:"たべもの"}, {q:"tomato", a:"とまと", cat:"たべもの"}, {q:"hourensou", a:"ほうれんそう", cat:"たべもの"},
  {q:"niku", a:"にく", cat:"たべもの"}, {q:"nomimono", a:"のみもの", cat:"のみもの"},

  // もの（14）
  {q:"isu", a:"いす", cat:"もの"}, {q:"tukue", a:"つくえ", cat:"もの"}, {q:"futon", a:"ふとん", cat:"もの"}, {q:"makura", a:"まくら", cat:"もの"},
  {q:"kasa", a:"かさ", cat:"もの"}, {q:"kutu", a:"くつ", cat:"もの"}, {q:"huku", a:"ふく", cat:"もの"}, {q:"nori", a:"のり", cat:"もの"},
  {q:"hasami", a:"はさみ", cat:"もの"}, {q:"kureyon", a:"くれよん", cat:"もの"}, {q:"kami", a:"かみ", cat:"もの"}, {q:"hon", a:"ほん", cat:"もの"},
  {q:"ehon", a:"えほん", cat:"もの"}, {q:"ohuro", a:"おふろ", cat:"せいかつ"},

  // しぜん（9）
  {q:"sora", a:"そら", cat:"しぜん"}, {q:"yama", a:"やま", cat:"しぜん"}, {q:"kawa", a:"かわ", cat:"しぜん"}, {q:"umi", a:"うみ", cat:"しぜん"},
  {q:"ike", a:"いけ", cat:"しぜん"}, {q:"hana", a:"はな", cat:"しぜん"}, {q:"kusa", a:"くさ", cat:"しぜん"}, {q:"taiyou", a:"たいよう", cat:"しぜん"},
  {q:"tuki", a:"つき", cat:"しぜん"},

  // じかん（4）・ばしょ・方向（3）
  {q:"asa", a:"あさ", cat:"じかん"}, {q:"hiru", a:"ひる", cat:"じかん"}, {q:"yoru", a:"よる", cat:"じかん"}, {q:"ima", a:"いま", cat:"じかん"},
  {q:"mae", a:"まえ", cat:"ばしょ・方向"}, {q:"ue", a:"うえ", cat:"ばしょ・方向"}, {q:"sita", a:"した", cat:"ばしょ・方向"},

  // いろ（6）
  {q:"aka", a:"あか", cat:"いろ"}, {q:"ao", a:"あお", cat:"いろ"}, {q:"kiiro", a:"きいろ", cat:"いろ"}, {q:"siro", a:"しろ", cat:"いろ"},
  {q:"kuro", a:"くろ", cat:"いろ"}, {q:"murasaki", a:"むらさき", cat:"いろ"},

  // ひと（4）
  {q:"otouto", a:"おとうと", cat:"ひと"}, {q:"imouto", a:"いもうと", cat:"ひと"}, {q:"sensei", a:"せんせい", cat:"ひと"}, {q:"watasi", a:"わたし", cat:"ひと"},

  // あいさつ（3）
  {q:"oyasumi", a:"おやすみ", cat:"あいさつ"}, {q:"ohayou", a:"おはよう", cat:"あいさつ"}, {q:"sayounara", a:"さようなら", cat:"あいさつ"},

  // どうさ（6）
  {q:"aruku", a:"あるく", cat:"どうさ"}, {q:"hasiru", a:"はしる", cat:"どうさ"}, {q:"miru", a:"みる", cat:"どうさ"}, {q:"kiku", a:"きく", cat:"どうさ"},
  {q:"warau", a:"わらう", cat:"どうさ"}, {q:"naku", a:"なく", cat:"どうさ"},

  // ようす・きもち（6）
  {q:"amai", a:"あまい", cat:"ようす・きもち"}, {q:"karai", a:"からい", cat:"ようす・きもち"}, {q:"itai", a:"いたい", cat:"ようす・きもち"},
  {q:"suki", a:"すき", cat:"ようす・きもち"}, {q:"omosiroi", a:"おもしろい", cat:"ようす・きもち"}, {q:"atari", a:"あたり", cat:"ようす・きもち"},

  // かず（2）
  {q:"hitori", a:"ひとり", cat:"かず"}, {q:"hutari", a:"ふたり", cat:"かず"}
];

// ====== カテゴリの広がり（少数カテゴリを補完） ======
const WIDEN = {
  "あいさつ": ["あいさつ","ひと"],
  "のみもの": ["のみもの","たべもの"],
  "かず": ["かず","ひと"],
  "せいかつ": ["せいかつ","もの"],
  "ようす・きもち": ["ようす・きもち","どうさ"]
};

// ====== ユーティリティ ======
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function kataToHira(str){ return str.replace(/[\u30A1-\u30F6]/g, s => String.fromCharCode(s.charCodeAt(0)-0x60)); }
function normalizeKana(str){ if(!str) return ""; return kataToHira(str.trim()); }

// ====== 状態 ======
let order = shuffle(DATA.map((_,i)=>i));
let idx = 0; let ok = 0, ng = 0;

const els = {
  q: document.getElementById('q'), counter: document.getElementById('counter'), choiceArea: document.getElementById('choiceArea'),
  hintBtn: document.getElementById('hintBtn'), showBtn: document.getElementById('showBtn'), speakBtn: document.getElementById('speakBtn'), nextBtn: document.getElementById('nextBtn'),
  feedback: document.getElementById('feedback'), hint: document.getElementById('hint'),
  ok: document.getElementById('ok'), ng: document.getElementById('ng'), rate: document.getElementById('rate'),
  autoNext: document.getElementById('autoNext'), shuffleBtn: document.getElementById('shuffleBtn'), resetBtn: document.getElementById('resetBtn')
};

function setStats(){ els.ok.textContent=ok; els.ng.textContent=ng; const total=ok+ng; els.rate.textContent= total? Math.round(ok*100/total):0; }
function setCounter(){ els.counter.textContent = (idx+1) + " / " + order.length; }
function currentQA(){ return DATA[order[idx]]; }

// ====== 選択肢（同カテゴリ優先） ======
function buildChoices(ci){
  const item = DATA[ci];
  const cat = item.cat;
  const baseCats = WIDEN[cat] || [cat];
  let pool = DATA.map((x,i)=>({x,i})).filter(o=> o.i!==ci && baseCats.includes(o.x.cat));
  if (pool.length < 2){
    const others = DATA.map((x,i)=>({x,i})).filter(o=> o.i!==ci && !baseCats.includes(o.x.cat));
    pool = [...pool, ...others];
  }
  const distractors = shuffle(pool).slice(0,2).map(o=>o.x);
  return shuffle([item, ...distractors]);
}

// ====== 表示 ======
function render(){
  const qa = currentQA();
  els.q.textContent = qa.q; setCounter();
  els.feedback.textContent = ""; els.feedback.className = "feedback"; els.hint.textContent = "";

  const ci = order[idx];
  const options = buildChoices(ci);
  els.choiceArea.innerHTML = "";
  for(const opt of options){
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt.a;
    btn.addEventListener('click', ()=>{
      const isOk = normalizeKana(opt.a) === normalizeKana(qa.a);
      if (isOk){ btn.classList.add('correct'); showFeedback(true); ok++; setStats(); if (els.autoNext.checked){ setTimeout(next, 650); } }
      else { btn.classList.add('wrong'); showFeedback(false); ng++; setStats(); }
      Array.from(els.choiceArea.children).forEach(b=>{ b.disabled=true; if (normalizeKana(b.textContent)===normalizeKana(qa.a)) b.classList.add('correct'); });
    });
    els.choiceArea.appendChild(btn);
  }
}

function showFeedback(isOk){ els.feedback.className = 'feedback ' + (isOk? 'ok':'ng'); els.feedback.textContent = isOk? 'せいかい！' : 'ざんねん…'; }
function next(){ idx++; if (idx>=order.length){ idx=0; order=shuffle(order); } render(); }

// ====== ヒント・表示・音声 ======
function maskHint(ans){ if(!ans) return ''; const first=ans[0]; return 'ヒント：' + first + '・'.repeat(Math.max(0, ans.length-1)); }
els.hintBtn.addEventListener('click', ()=>{ els.hint.textContent = maskHint(currentQA().a); });
els.showBtn.addEventListener('click', ()=>{ els.feedback.className='feedback'; els.feedback.textContent = 'こたえ：' + currentQA().a; });
let jaVoice = null; function selectJaVoice(){ const voices = window.speechSynthesis?.getVoices?.() ?? []; jaVoice = voices.find(v=>/ja|japan/i.test(v.lang)) || voices.find(v=>/ja|japan/i.test(v.name)) || voices[0] || null; }
if ('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = selectJaVoice; selectJaVoice(); }
els.speakBtn.addEventListener('click', ()=>{ const a=currentQA().a; if(!('speechSynthesis' in window)){ alert('この端末では音声読み上げが使えません。'); return;} if(!jaVoice){ selectJaVoice(); } const u=new SpeechSynthesisUtterance(a); if(jaVoice) u.voice=jaVoice; u.lang=(jaVoice?.lang||'ja-JP'); u.rate=0.95; u.pitch=1.05; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); });

// ====== その他 ======
els.nextBtn.addEventListener('click', next);
els.shuffleBtn.addEventListener('click', ()=>{ order = shuffle(order); idx=0; render(); });
els.resetBtn.addEventListener('click', ()=>{ ok=0; ng=0; setStats(); order = shuffle(DATA.map((_,i)=>i)); idx=0; render(); });

setStats();
render();
</script>
</body>
</html>
